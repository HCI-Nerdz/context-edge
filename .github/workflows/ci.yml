name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-context-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build
